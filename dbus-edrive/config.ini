; dbus-edrive configuration — boat-specific values.
; All values shown are also the built-in defaults unless noted.

[general]
; DEBUG, INFO, WARNING
log_level = INFO

[can]
interface = can0
reconnect_delay_s = 5

[publish]
; D-Bus update rate. The drives send at ~10 Hz; VRM does not need that, and
; 1 Hz is what the Node-RED flow published.
rate_ms = 1000
; No frame from a drive for this long -> /Connected = 0 and every value
; blanked. The drives are silent whenever the hybrid system is powered down,
; which is most of the time at the dock.
stale_after_s = 6
product_name = Greenline 6GK E-Drive
; Publish the telemetry the Victron motordrive class has no path for under
; /EDrive/ (torque N.m and %, throttle %, phase currents, mechanical power,
; MOSFET temp, running flag, raw status byte). Costs nothing and is the only
; way Signal K / MQTT / the HTML5 app can see it.
publish_extra = true
; |rpm| below this reads as 0. The float is signed and noisy at standstill,
; so without this VRM shows -1 rpm on a stopped drive.
rpm_deadband = 1.0
; Values are put on D-Bus only when they move to a different step, and a
; tick's changes go out as ONE ItemsChanged per drive. Without this an idle
; drive's float jitter cost ~9 bus signals a second per drive, each delivered
; to every listener on the Cerbo (2026-09-05: enough load to trip the
; watchdog). Units: V, A, W, °C, Nm, %, A.
voltage_step = 0.1
current_step = 0.5
power_step = 10
temperature_step = 0.5
torque_step = 0.5
throttle_step = 0.5
phase_current_step = 1
; Standstill deadbands (Nm, A): below these a stopped drive publishes exactly
; 0 for torque, DC current, phase currents and mechanical power instead of a
; different flicker of noise every second.
torque_deadband = 1.0
current_deadband = 1.0

[calibration]
; 61452 w2 -> motor DC current: amps = offset + slope * w2.
; Fit r=0.9994 against the MFD's MOTOR CURRENT readout; the sign is inverted
; on purpose so positive = motoring (drawing from the pack). Working in
; GreenlineFindings.md. Re-fit here if the drives are ever recalibrated —
; never in the code.
dc_current_offset = 800.409
dc_current_slope = -0.024918
; 65363 bytes 1-2 -> throttle %: raw / divisor. Exact over the 0-8.1 % that
; was exercised (four settled plateaus, zero intercept); full travel
; extrapolates to raw ~928 and is UNVERIFIED.
throttle_divisor = 9.280
; 61452 w4 -> phase current peak A
phase_peak_divisor = 20.0

; One [drive.<key>] section per motor. Each drive is identified three
; different ways depending on the frame family, and the mapping is NOT
; consistent between them — the HCU source addresses are inverted relative to
; the CANopen node ids. That inversion is proven (single-motor runs, see
; GreenlineFindings.md), not assumed, so do not "fix" it.
;
;   canopen_node   11-bit TPDO node id: 0x0A = PORT, 0x0B = STARBOARD
;   hcu_source     29-bit J1939 source: 0x65 = PORT, 0x64 = STARBOARD
;   n2k_instance   engine instance in PGN 127493 / 65363: 0 = port, 1 = stbd
;
; Reserved instance block: 210-219 motor drives. 210/211 carried over from
; InstanceRegistry.json so VRM history survives the migration from the flow.

[drive.port]
canopen_node = 0x0A
hcu_source = 0x65
n2k_instance = 0
instance = 210
; -> com.victronenergy.motordrive.edrive_port
service_suffix = edrive_port
; -> /Settings/Devices/edrive_port/ClassAndVrmInstance (instance pinning).
; No `virtual_` prefix: that one belongs to the Node-RED palette, whose
; auto-cleanup deletes entries it does not recognise.
settings_id = edrive_port
custom_name = Port E-Motor

[drive.starboard]
canopen_node = 0x0B
hcu_source = 0x64
n2k_instance = 1
instance = 211
service_suffix = edrive_stbd
settings_id = edrive_stbd
custom_name = Starboard E-Motor
