; dbus-solarpriority configuration — boat-specific values.
; Values shown are the built-in defaults (= the Node-RED flow's v4.2 values).
; The driver reads this file once at start: `svc -t /service/dbus-solarpriority`
; after editing.

[general]
log_level = INFO

[service]
; -> com.victronenergy.switch.solarpriority, pinned via
; /Settings/Devices/solarpriority/ClassAndVrmInstance (no virtual_ prefix, so
; the Node-RED palette's auto-cleanup never touches it). 221 was the flow's
; toggle instance; the slider now lives on output_2 of the same service, so
; 222 is retired (never reuse it).
service_suffix = solarpriority
settings_id = solarpriority
instance = 221
; UI group: VRM/GUI-v2 group switch outputs by this string across services,
; so "BMS" puts the toggle and slider next to the Max Charge slider
; (dbus-recbms config.ini [slider] group). Any common string works.
group = BMS
toggle_name = Solar Priority
slider_name = PV Capacity
; PV capacity slider (a sanity ceiling on the estimate, not a model input);
; 1800 W ~= the array's observed 7-day peak of ~1750 W
rated_min_w = 100
rated_max_w = 2500
rated_step_w = 50
rated_default_w = 1800

[inputs]
; device instances (the flow's pre-filled services)
mppt_a_instance = 278      ; MPPT 100/20  (the flow's "6" / share 0.35)
mppt_b_instance = 279      ; MPPT 150/35  (the flow's "7" / share 0.65)
vebus_instance = 276       ; the Quattro
battery_instance = 200     ; dbus-recbms (>= 1.3.0; 1.4.0 for lead verification)
; shore lands on AC input 1 or 2 (selects /Ac/Control/IgnoreAcIn1|2 and the
; ActiveInput value that means "on shore")
shore_ac_input = 1
; decision tick
tick_ms = 1000
; EstimateW / NeedW step (W); a tick's changes go out as one ItemsChanged.
power_step = 5

[engine]
; Every tunable of the flow's Decision Engine, lower-cased, same units
; (ms / W / V / %). Only override what you change; see README for meaning.
;solar_margin = 1.2
;min_est_w = 100
;ready_ms = 30000
;ramp_ms = 90000
;eval_ms = 15000
;discharge_tol_w = 50
;load_exceed_ms = 15000
;solar_settle_ms = 90000
;deficit_avg_ms = 90000
;surge_w = 400
;surge_ms = 3000
;cooldown_ms = 300000
;backoff_max_ms = 3600000
;stable_ms = 1800000
;min_soc = 40
;soc_emergency = 30
;soc_drift_max = 2
;hb_stale_ms = 20000
;assert_ms = 30000
;feedback_grace_ms = 90000
;cap_smooth = 0.3
;cap_fresh_ms = 900000
;cap_zero_ms = 5400000
;voc_day_v = 55
;voc_explore_v = 65
;cvl_margin_v = 0.05
;wake_ms = 60000
;burn_exit_drop_v = 0.15
;burn_exit_ms = 30000
;burn_calm_ms = 15000
;burn_calm_gate_ms = 45000
;surplus_quiet_w = 100
;boost_v = 0.30
;boost_interval_ms = 900000
;boost_retry_ms = 180000
;burn_rearm_v = 0.25
;harvest_arm_v = 0.02
;refill_reset_v = 0.10
;harvest_min_evid = 100
;stall_burn_min_v = 0.05
;suspend_load_w = 1000
;suspend_ms = 3000
;suspend_max_ms = 1200000
;resume_delta_w = 200
;resume_ms = 10000
;load_avg_ms = 60000
;mdl_a_v = 3.5
;mdl_voc_idle_w = 3
;mdl_voc_tau_ms = 600000
;mdl_min_w = 10
;mdl_cal_min_w = 30
;mdl_kff_def = 0.78
;mdl_kff_alpha = 0.05
;mdl_ratio_min = 0.02
;mdl_ratio_conf = 0.3
;mdl_max_mult = 20
;mdl_fresh_ms = 300000
;mdl_share6 = 0.35
;mdl_share7 = 0.65
;voc_rise_v = 1.0
; one-way charge / discharge (engine 4.3, needs dbus-recbms >= 1.5.0). When
; the Max Charge target is more than enter_pct away from the SOC, the bank is
; only ever moved toward it: charging, solar does all the charging and shore
; only sustains (dbus-recbms reads the slider as the present SOC while the
; charger is connected); discharging, nothing charges and the loads drain it
; day and night. Stands down within exit_pct of the target. 0 disables.
;oneway_enter_pct = 5
;oneway_exit_pct = 1
; pre-probe checks (engine 4.4). An unthrottled capture younger than
; cap_trumps_mdl_ms caps the panel model (a measurement beats a guess); a
; probe is refused while the two arrays' fresh captures, each divided by its
; rated share (mdl_share6/7), disagree by more than shade_balance_min (an
; obstruction on one string -- sun angle and throttling move both together);
; the need is judged against the slower load_slow_ms average as well as the
; 60 s one.
;cap_trumps_mdl_ms = 900000
;shade_balance_min = 0.4
;load_slow_ms = 300000
; one-way charge: solar is kept until the bank's mean over oneway_deficit_ms
; is below -oneway_deficit_w (the 4.2 rule of -50 W over 90 s reconnected
; shore over a one-minute dip, and each reconnect costs a 0.6-2 kW re-absorb
; from shore for ten-plus minutes). The surge exit is off in this mode; the
; 2 % SOC-drift exit and the heater suspend remain.
;oneway_deficit_w = 200
;oneway_deficit_ms = 600000
; engine 4.5 (2026-09-06). A target at or above oneway_full_pct is a request
; for a FULL charge from every charger at its maximum, so one-way charge
; never engages there: at 100 % the floor had the Quattro holding the bank
; at the present SOC and only solar could move it, so it never got full.
; 0 disables the exception. Also since 4.5 the floor is only requested while
; the Quattro actually reports shore as its active input -- with no AC
; available it inverts regardless, and a floor would only throttle solar.
;oneway_full_pct = 100
