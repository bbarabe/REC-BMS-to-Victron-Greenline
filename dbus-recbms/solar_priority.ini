; dbus-solarpriority configuration — boat-specific values.
; Values shown are the built-in defaults (= the Node-RED flow's v4.2 values).
; The driver reads this file once at start: `svc -t /service/dbus-solarpriority`
; after editing.

[general]
log_level = INFO

[service]
; -> com.victronenergy.switch.solarpriority, pinned via
; /Settings/Devices/solarpriority/ClassAndVrmInstance (no virtual_ prefix, so
; the Node-RED palette's auto-cleanup never touches it). 221 was the flow's
; toggle instance; the slider now lives on output_2 of the same service, so
; 222 is retired (never reuse it).
service_suffix = solarpriority
settings_id = solarpriority
instance = 221
; UI group: VRM/GUI-v2 group switch outputs by this string across services,
; so "BMS" puts the toggle and slider next to the Max Charge slider
; (dbus-recbms config.ini [slider] group). Any common string works.
group = BMS
toggle_name = Solar Priority
slider_name = PV Capacity
; PV capacity slider (a sanity ceiling on the estimate, not a model input);
; 1800 W ~= the array's observed 7-day peak of ~1750 W
rated_min_w = 100
rated_max_w = 2500
rated_step_w = 50
rated_default_w = 1800

[inputs]
; device instances (the flow's pre-filled services)
mppt_a_instance = 278      ; MPPT 100/20  (the flow's "6" / share 0.35)
mppt_b_instance = 279      ; MPPT 150/35  (the flow's "7" / share 0.65)
vebus_instance = 276       ; the Quattro
battery_instance = 200     ; dbus-recbms (>= 1.3.0; 1.4.0 for lead verification)
; Which Quattro AC input is shore (selects /Ac/Control/IgnoreAcIn1|2 and the
; ActiveInput value that means "on shore"). auto: the GX's own AC input types
; decide when exactly one input is Grid or Shore power (Settings -> System
; setup -> AC input 1/2 -- set those when rewiring); failing that the input
; already settled on is kept (it is remembered in
; /Settings/SolarPriority/ShoreInput), else the input the Quattro has
; accepted, else the only input with AC on it. Until one of those answers, the
; relay is left alone. 1 or 2 pins it. Published as /SolarPriority/ShoreInput.
shore_ac_input = auto
; EstimateW / NeedW step (W); a tick's changes go out as one ItemsChanged.
power_step = 5
; decision tick
tick_ms = 1000

[engine]
; Every tunable of the flow's Decision Engine, lower-cased, same units
; (ms / W / V / %). Only override what you change; see README for meaning.
;solar_margin = 1.2
;min_est_w = 100
;ready_ms = 30000
;ramp_ms = 90000
;eval_ms = 15000
;discharge_tol_w = 50
;load_exceed_ms = 15000
;solar_settle_ms = 90000
;deficit_avg_ms = 90000
;surge_w = 400
;surge_ms = 3000
;cooldown_ms = 300000
;backoff_max_ms = 3600000
;stable_ms = 1800000
;min_soc = 40
;soc_emergency = 30
;soc_drift_max = 2
;hb_stale_ms = 20000
;assert_ms = 30000
;feedback_grace_ms = 90000
;cap_smooth = 0.3
;cap_fresh_ms = 900000
;cap_zero_ms = 5400000
;voc_day_v = 55
;voc_explore_v = 65
;cvl_margin_v = 0.05
;wake_ms = 60000
;burn_exit_drop_v = 0.15
;burn_exit_ms = 30000
;burn_calm_ms = 15000
;burn_calm_gate_ms = 45000
;surplus_quiet_w = 100
;boost_v = 0.30
;boost_interval_ms = 900000
;boost_retry_ms = 180000
;burn_rearm_v = 0.25
;harvest_arm_v = 0.02
;refill_reset_v = 0.10
;harvest_min_evid = 100
;stall_burn_min_v = 0.05
; 2500 since engine 4.5.1 (was 1000): the 1.7 kW water heater's two minutes
; are 57 Wh, which the HOLD deficit budget carries and the sun repays; a
; suspend cost two relay edges every ~75 min. Suspend is for loads the budget
; should not carry for long (a heater left on, air conditioning, a charger).
;suspend_load_w = 2500
;suspend_ms = 3000
;suspend_max_ms = 1200000
;resume_delta_w = 200
;resume_ms = 10000
;load_avg_ms = 60000
;mdl_a_v = 3.5
;mdl_voc_idle_w = 3
;mdl_voc_tau_ms = 600000
;mdl_min_w = 10
;mdl_cal_min_w = 30
;mdl_kff_def = 0.78
;mdl_kff_alpha = 0.05
;mdl_ratio_min = 0.02
;mdl_ratio_conf = 0.3
;mdl_max_mult = 20
;mdl_fresh_ms = 300000
;mdl_share6 = 0.35
;mdl_share7 = 0.65
;voc_rise_v = 1.0
; one-way charge / discharge (engine 4.3, needs dbus-recbms >= 1.5.0). When
; the Max Charge target is more than enter_pct away from the SOC, the bank is
; only ever moved toward it: charging, solar does all the charging and shore
; only sustains (dbus-recbms reads the slider as the present SOC while the
; charger is connected); discharging, nothing charges and the loads drain it
; day and night. Stands down within exit_pct of the target. 0 disables.
; Engine 4.3.1: 1 / 0.5 (was 5 / 1, which a single slider step from the
; present SOC never reached). Engine 4.4: 2 / 0.5 -- HOLD lets the bank ride
; a point over the target, and ENTER has to stand clear of that band.
;oneway_enter_pct = 2
;oneway_exit_pct = 0.5
;
; HOLD rules (engine 4.4, needs dbus-recbms >= 4.1.0 with solar_gain_pct).
; At or under the Max Charge target -- since engine 4.5 at ANY distance under
; it, so a charge toward a far target runs them too (one-way charge is only
; the name on the status line; a one-way discharge keeps its own rules) --
; the relay is decided on the SOC and on measured power:
;   by day the Quattro is set to prefer solar, at night to charge now (and by
;     day only as a safety under safety_soc); day/night comes from the
;     brightest array's voltage (dawn_v for dawn_ms, under dusk_v for dusk_ms)
;   on shore under the target the bank is held where it is, never raised
;     (a dbus-recbms floor), unless it is day and the Quattro reads "prefer
;     solar" -- the sun does the refilling
;   leave shore when the sun covers the boat's need, or hold_frac of it with
;     the bank hold_mid_pct over the target. need = DC loads + inv_idle_w +
;     AC load / inv_eff; every departure logs predicted vs observed bank power
;   return when the island has drawn hold_deficit_pct of the bank (bank_ah
;     when the BMS does not publish its size) below its best point since it
;     left: deficit adds, surplus repays, never under zero
;   the island also ends once the arrays make under dark_w for dark_ms with
;     none reading "limited" (4.5.3, dusk by output), and once night is
;     declared (4.5.2); a suspend that runs into the night ends on shore.
;     Neither earns a backoff: dawn must not wait on it
;   the only probe: an array reports "limited" on shore by day, with the
;     bank at the MPPTs' target (limited_tol_v) -> the dbus-recbms boost
;     lifts the target, at most every probe_interval_ms, until the rules
;     are met or the output stops rising
;   the owner's Charge now: once the engine's own "prefer solar" has been seen
;     to land, a toggle that reads otherwise by day is the owner's click --
;     toggle left alone, no floor, the boat stays on shore until the bank is
;     at the target (or they flip it back, or switch Solar Priority off)
; hold_rules = 0 puts the 4.3 engine (probe / harvest / burn-down) back: no
; safety override, the Quattro's toggle left alone. Going back also needs
; solar_gain_pct = 0 in dbus-recbms config.ini (the 4.3 harvest logic assumes
; the MPPTs at the target and the Quattro below it).
;hold_rules = 1
;hold_mid_pct = 0.25
;hold_frac = 0.75
;hold_deficit_pct = 0.5
;bank_ah = 1440
;inv_idle_w = 120
;inv_eff = 0.95
;pred_check_ms = 120000
;hold_floor_gap_pct = 0.05
;probe_interval_ms = 1800000
;probe_min_ms = 20000
;probe_flat_ms = 20000
;probe_ready_ms = 10000
;dawn_v = 60
;dusk_v = 50
;dawn_ms = 600000
;dusk_ms = 300000
;safety_soc = 25
;safety_exit_soc = 27
;dark_w = 50
;dark_ms = 600000
; an array reads "limited" only with the bank within this of the MPPTs'
; effective target (4.5.4): the flag alone flickers at dusk and stands from
; 0.15 V under the target by day with the output uncurtailed
;limited_tol_v = 0.05
