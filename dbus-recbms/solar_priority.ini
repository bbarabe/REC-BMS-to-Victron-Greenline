; dbus-solarpriority configuration — boat-specific values.
; Version 2 policy consumer; the engine's tunables live in [engine] below
; (until 3.0.6 the header was missing, and uncommenting any key made
; ConfigParser reject the whole file). Every tunable of the engine,
; lower-cased, same units (ms / W / V / %); each ";key = value" line below is
; the shipped default. Only override what you change; see README for meaning.

[engine]
; engine 4.13: the need is dbus-recbms' complete DC-bus island demand (AC
; through the inverter's efficiency and idle, the DC loads, plus its
; demand_uncertainty_w once) smoothed over load_avg_ms and load_slow_ms;
; solar_margin multiplies that, so 1.0 (4.9 used 1.2 x the AC load alone).
;solar_margin = 1.0
;min_est_w = 100
;ready_ms = 30000
;ramp_ms = 90000
;eval_ms = 15000
;discharge_tol_w = 50
;load_exceed_ms = 15000
;solar_settle_ms = 90000
;deficit_avg_ms = 90000
;surge_w = 400
;surge_ms = 3000
;cooldown_ms = 300000
;backoff_max_ms = 3600000
;stable_ms = 1800000
;min_soc = 40
;soc_emergency = 30
;soc_drift_max = 2
;hb_stale_ms = 20000
;assert_ms = 30000
;feedback_grace_ms = 90000
;cap_smooth = 0.3
;cap_fresh_ms = 900000
;cap_zero_ms = 5400000
;voc_day_v = 55
;voc_explore_v = 65
;cvl_margin_v = 0.05
;wake_ms = 60000
;surplus_quiet_w = 100
;boost_v = 0.30
;boost_interval_ms = 900000
;boost_retry_ms = 180000
;suspend_load_w = 1000
;suspend_ms = 3000
;suspend_max_ms = 1200000
;resume_delta_w = 200
;resume_ms = 10000
;load_avg_ms = 60000
;mdl_a_v = 3.5
;mdl_voc_idle_w = 3
;mdl_voc_tau_ms = 600000
;mdl_min_w = 10
;mdl_cal_min_w = 30
;mdl_kff_def = 0.78
;mdl_kff_alpha = 0.05
;mdl_ratio_min = 0.02
;mdl_ratio_conf = 0.3
;mdl_max_mult = 20
;mdl_fresh_ms = 300000
;mdl_share6 = 0.35
;mdl_share7 = 0.65
;voc_rise_v = 1.0
; one-way charge / discharge (engine 4.3, needs dbus-recbms >= 1.5.0). When
; the Max Charge target is more than enter_pct away from the SOC, the bank is
; only ever moved toward it: charging, solar does all the charging and shore
; only sustains (dbus-recbms reads the slider as the present SOC while the
; charger is connected); discharging, nothing charges and the loads drain it
; day and night. Stands down within exit_pct of the target. 0 disables.
; Engine 4.12: enter beyond one full SOC point (the step dbus-recbms itself
; counts as movement), stand down within half a point (five times the
; sustain servo's deadband, fifty times the hi-res SOC resolution). 4.3's
; 5 points let a whole slider step, and a restart with under 5 points to
; go, run as HOLD, where the shore charger fills the gap.
;oneway_enter_pct = 1
;oneway_exit_pct = 0.5
; pre-probe checks (engine 4.4). An unthrottled capture younger than
; cap_trumps_mdl_ms caps the panel model (a measurement beats a guess); a
; probe is refused while the two arrays' fresh captures, each divided by its
; rated share (mdl_share6/7), disagree by more than shade_balance_min (an
; obstruction on one string -- sun angle and throttling move both together);
; the need is judged against the slower load_slow_ms average as well as the
; 60 s one.
;cap_trumps_mdl_ms = 900000
;shade_balance_min = 0.4
;load_slow_ms = 300000
; one-way charge: solar is kept until the bank's mean over oneway_deficit_ms
; is below -oneway_deficit_w. Engine 4.3 allowed -200 W over ten minutes
; because each reconnect then cost a 0.6-2 kW Quattro re-absorb; the sustain
; charge-current cap has removed that cost, and on 2026-09-10 the tolerance
; let the bank drain for two hours of thin sun while it was meant to be
; charging. 4.8: -50 W over three minutes (the normal engine's own rule is
; -50 W over 90 s). The surge exit is off in this mode; the 2 % SOC-drift
; exit and the heater suspend remain.
;oneway_deficit_w = 50
;oneway_deficit_ms = 180000
; engine 4.5 (2026-09-06). A target at or above oneway_full_pct is a request
; for a FULL charge from every charger at its maximum, so one-way charge
; never engages there: at 100 % the floor had the Quattro holding the bank
; at the present SOC and only solar could move it, so it never got full.
; Must stay within 1..100: the REC protocol maps a 100 % target to
; COMPLETE_FULL, which releases sustain, so 0 (no exception) or a value
; above 100 would have the engine ask for a floor the protocol rejects; the
; consumer refuses to start on such a value (3.0.5). Also since 4.5 the floor
; is only requested while the Quattro actually reports shore as its active
; input -- with no AC available it inverts regardless, and a floor would
; only throttle solar.
;oneway_full_pct = 100
; engine 4.6 (2026-09-09). The SOC floor for leaving shore, and for staying
; on solar, while charging one-way. min_soc (40) and soc_emergency (30)
; protect a bank being inverted into; charging one-way on solar the bank is
; being charged and the deficit exit is bounded, yet at 30 % the engine sat
; on shore in full sun behind the 40 % gate. The 30 % emergency lockout is
; skipped only while the bank's ten-minute mean is positive (the sun is
; carrying it) AND the SOC is above this line; under it the lockout fires
; as before, sun or not. Discharge mode and the normal engine keep min_soc.
;oneway_min_soc = 25
; engine 4.7 (2026-09-10). A measurement boost is only asked for while at
; least this much PV is actually flowing: at dusk the open-circuit voltage
; stays over voc_day_v on the marina lights and boosts fired every fifteen
; minutes on zero yield, each lifting the sustain charge-current cap.
;boost_min_pv_w = 20
; engine 4.9 (2026-09-11). On the sustain floor both MPPTs run unthrottled a
; band above the bank, so their captures ARE the capacity: with no producing
; array at its ceiling and a fresh capture that clears the need, one-way
; charge goes straight to solar (no 90 s probe, no probe boost), and no
; measurement boost is requested while the arrays are unthrottled. 0
; restores the probe.
;oneway_skip_probe = 1
; Stage A (2026-09-14, master review D02/D14/D16). Two timing repairs, both
; in the engine, neither of them a new tunable knob for normal use:
;  - the sustain floor is asked for as soon as shore is AVAILABLE (VE.Bus
;    /Ac/State/AcIn<shore_ac_input>Available) or any AC input is accepted,
;    not once ActiveInput finally reports shore -- acceptance is the last
;    thing to happen at a return, so the floor and its charge-current cap
;    used to arrive one tick after the relay closed (pack 56.41 V against a
;    59.34 V Quattro CVL at 200 A). Where the firmware publishes no such
;    path availability stays unknown, and the floor is held until shore has
;    actually been absent for feedback_grace_ms.
;  - the probe's ramp clock starts on the confirmed physical departure
;    (ActiveInput 240) AND once the bank has probe_headroom_v of room below
;    the effective CVL; until then nothing is measured, and after
;    feedback_grace_ms without both the engine returns to shore on the
;    ordinary cooldown -- a delayed transfer or a full bank is not a failed
;    solar measurement. The default matches dbus-recbms' boost min_margin_v.
;probe_headroom_v = 0.10
; Stage B (2026-09-14, engine 4.15, master D03/SP23/SP26). At the target
; HOLD now asks dbus-recbms for the two-sided hold (sustain mode 3) instead
; of releasing the bank to the slider, so the ordinary harvest-and-burn and
; the ceiling-stall burn-down are gone along with the burndown state itself.
; Their keys went with them: burn_exit_drop_v, burn_exit_ms, burn_calm_ms,
; burn_calm_gate_ms, burn_rearm_v, harvest_arm_v, refill_reset_v,
; harvest_min_evid and stall_burn_min_v. Config reads only the keys the
; engine defines, so any of these left in an older ini is silently ignored
; rather than rejected -- delete them when you next touch such a file.
