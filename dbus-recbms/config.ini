; dbus-recbms configuration — boat-specific values.
; All values shown are also the built-in defaults unless noted.

[general]
; DEBUG, INFO, WARNING
log_level = INFO

[can]
interface = can0
; YDNB-07 repackages the 11-bit CAN-BMS ids 0xNNN as 29-bit 0x18FF0NNN
filter_id = 0x18FF0000
filter_mask = 0x1FFFF800
reconnect_delay_s = 5

[battery]
; -> com.victronenergy.battery.recbms
service_suffix = recbms
; -> /Settings/Devices/recbms/ClassAndVrmInstance (instance pinning)
settings_id = recbms
instance = 200
product_name = REC-BMS
custom_name = REC-BMS Main Bank
; Fallback only — the BMS broadcasts the rated/installed capacity in 0x379
; ("BatterySize", 1440 Ah here), which is what /InstalledCapacity uses per the
; Victron CAN-BMS protocol. Do not confuse it with 0x35F bytes 4-5, the
; capacity CONFIGURED in the BMS (1400 Ah) — published separately as
; /RecBms/ConfiguredCapacity, and misread as a firmware version before v1.3.1.
installed_capacity_ah = 1440
; 15S NMC
nr_of_cells = 15
serial = REC-BMS
; forward the BMS 0x360 byte-0 flag to /Info/ChargeRequest. KEEP OFF on
; this boat: (1) this REC asserts 0xFF in byte 0 PERMANENTLY (observed at
; 65% SOC, balanced cells, at rest — it is a static capability flag, not a
; charge request, see Decoded.md), and (2) the consumers on this fw are:
; systemstate.py (pins the GUI/VRM system state to "Recharge"), the gui-v2
; battery-parameters page (display row), and hub4control — the ESS
; grid-setpoint controller, which DOES force grid recharging on a charge
; request. This boat has no ESS/Hub-4 assistant in the Quattro (no /Hub4/*
; paths on the vebus), so hub4control idles and the only live effect is
; the display — but forwarding a constant 0xFF would command PERMANENT
; grid force-charge the day ESS is ever configured. dvcc.py and mk2-dbus
; never read the path (the Quattro itself cannot see it). The raw flag
; stays visible at /RecBms/ForceChargeRequest regardless.
forward_charge_request = false
; v1.4.0: pin /Settings/SystemSetup/BmsInstance to this instance while it is
; still on automatic (-1), so no other battery service can ever be picked as
; the DVCC BMS. An explicit choice (any other value) is never overridden.
pin_bms_instance = true

[slider]
; the VRM "Max Charge" slider (com.victronenergy.switch.recbms_maxcharge)
enabled = true
service_suffix = recbms_maxcharge
settings_id = recbms_maxcharge
instance = 220
custom_name = Max Charge
group = BMS
unit = %
min = 40
max = 100
step = 5
default = 100

[cvl]
# Provisional installation ceiling; fresh lower REC limits always win.
installation_max_v = 62.40
# Measured-pack approach guard; physical overshoot margin needs commissioning.
voltage_guard_v = 0.10
; CVL = piecewise-linear interpolation of "pct:volts" breakpoints, then
; clipped to max_v. Calibrated 2026-08-19 against measured settled holds on
; the REC's own scale (15S NMC):
;   58.6% <-> 56.28V  (settled hold, tail ~1A)
;   62.3% <-> 56.65V  (days-long hold equilibrium at ~0A)
;   100%  <-> 62.70V  (legacy endpoint from raw CVL; SOC synchronization unverified)
; Both measured mid points lie exactly on 0.100 V/% — the NMC mid-plateau
; is flatter than the 62->100% region (0.1605 V/%), so the map has a knee
; at the 62.3% anchor. Below it: slope 0.100 (40% -> 54.42V, 60% -> 56.42V);
; above it: unchanged from the previous line (65% -> 57.08V, 100% -> 62.70V).
; NMC steepens again below ~50%, so low slider values may settle a little
; high until a measured point exists there — add breakpoints as holds settle.
curve = 40:54.42, 62.3:56.65, 100:62.70
; Normal/full charging ceiling for the Quattro command. Only a solar boost
; (max_boost_v, on the MPPTs alone) may ride above it, and both chargers
; always obey the installation and fresh REC limits. There is no maintenance
; lift and no equalization in the active path (3.0: both disabled).
max_v = 61.96
; Quattro/solar split (v1.3.0): command the Quattro this far BELOW the
; target and raise only the solar chargers back up to it (same systemcalc
; offset the solar boost uses, re-asserted every tick). Why: the Quattro's
; absorption holds +0.05..+0.15V ABOVE its commanded CVL (measured
; 2026-08-19 with SVS on and the BMS/Quattro/sense meters agreeing to
; 10mV), overcharging past every calibrated equilibrium; the MPPTs
; regulate accurately, so with the lead the Quattro lands at or just under
; the target and solar finishes the top-off. Side effect: near the target
; only solar can charge — standing MPPT headroom on shore (passive solar
; priority and free unthrottled capacity readings). 0 disables (the
; built-in default) and restores v1.2 behavior.
solar_lead_v = 0.15
; v1.7.0: the lead is a Solar Priority tool (MPPT headroom on shore). It is
; applied only while /Settings/SolarPriority/Enabled is 1, and never with
; the Max Charge slider at/above lead_full_pct: a full charge means every
; charger is commanded the true target and the systemcalc offset is 0. The
; Quattro's +0.05..0.15 V bias is a hold-at-voltage effect; a bulk charge to
; the calibrated 100 % point does not overshoot (owner, 2026-09-07).
lead_needs_solar_priority = true
lead_full_pct = 100
; Regulation fault (3.0.1). Every tick the driver verifies the voltage pair
; it asked for against com.victronenergy.system /Control/EffectiveChargeVoltage
; (what DVCC really sends) and every charger's own readback
; (/RecBms/Voltage/Ready). systemcalc applies the SolarVoltageOffset ONLY
; while the GX access level is Superuser (/Settings/System/AccessLevel > 2),
; evaluated once per systemcalc process -- the D-Bus write succeeds either
; way -- and that is the usual cause. An ordinary update (servo step, slider
; move, boost) is unverified for a few seconds; a pair that stays unverified
; for lead_verify_s is a fault: boosts refused, /RecBms/SolarLead reads 0,
; /RecBms/LeadFault names the cause, /Alarms/InternalFailure is raised to
; warning (1) if lead_fault_alarm is on. The commands themselves stand (no
; fallback to the full slider); charge current stays inhibited unless the
; pair was verified before and is still within the safe envelope. Clears by
; itself the tick the pair is verified again (access level raised +
; systemcalc restarted).
lead_verify_s = 30
lead_fault_alarm = true

[fallback]
; staged fallback when BMS CAN goes stale; CCL is 0 in every fallback phase
live_timeout_s = 60
alert_timeout_s = 120
restrict_timeout_s = 300
; cold boot: benign STARTUP phase until first frame, at most this long
startup_grace_s = 180
; STARTUP and ALERT share these permissive limits (inverter keeps running,
; DVL below resting pack voltage so no false low-battery cutoff)
alert_dcl_a = 100
alert_dvl_v = 52.0
restrict_dcl_a = 30
restrict_dvl_v = 53.0
survival_dcl_a = 15
survival_dvl_v = 54.0
; substitutes when a value was never received
safe_cvl_v = 54.0
safe_voltage_v = 54.0
safe_soc = 50

[quattro]
; independent pack-voltage source while BMS CAN is stale
vebus_instance = 276
max_age_s = 30
poll_s = 5

[solarboost]
; The boost primitive. The policy protocol (rec_policy_adapter, leased
; requests from dbus-solarpriority) authorizes it; the direct
; /RecBms/SolarBoost/Request path is refused while a consumer owns the
; protocol and a lease refresh never renews an accepted boost.
; A request-and-forget control that biases ONLY the solar chargers above the
; published CVL, so they out-regulate the Quattro instead of being squeezed to
; zero by it. While boosted the MPPTs run unthrottled (MppOperationMode 2),
; which is the condition where their output IS their capacity -- so this
; measures the array without dropping shore power.
;
; Write volts to /RecBms/SolarBoost/Request, 0 to release. It ALWAYS expires
; on its own after hold_s, so a requester that dies cannot leave the bank
; charging high; the driver also clears it at startup and on shutdown.
enabled = true
; requests above this are refused outright
max_boost_v = 0.30
; hard expiry. Never sticky.
hold_s = 120
; when the requester should sample. Measured 2026-08-19: with ~0.15V of
; margin both chargers reached MppOperationMode 2 in 43-45 s and 90 % of the
; step in 53 s, so 75 s leaves ~20 s of slack before the window opens.
measure_start_s = 75
measure_len_s = 30
; safety clamp against LIVE cell data, re-checked every tick while active.
; 15S NMC: pack CVL 56.42V is ~3.76V/cell, alarm at 4.20V.
cell_max_v = 4.05
cell_min_t = 5
cell_max_t = 45
; Legacy boost ceiling; also clamped by the installation ceiling and fresh REC CVL.
ceiling_v = 62.40
; refuse the boost unless (CVL + boost) clears the present pack voltage by at
; least this much -- with less margin the MPPTs ramp too slowly for the
; measurement window to mean anything (126 s to 5 % at ~0.05V, measured).
min_margin_v = 0.10
; systemcalc applies this offset to the solar chargers only
target_service = com.victronenergy.system
target_path = /Debug/BatteryOperationalLimits/SolarVoltageOffset

[sustain]
; The hold primitive. The policy protocol (rec_policy_adapter) owns it as it
; does the boost; the direct /RecBms/Sustain/Request path is refused while a
; consumer owns the protocol.
; v1.5.0. A request-and-forget control that holds the bank WHERE IT IS
; instead of moving it. Write 1 to /RecBms/Sustain/Request for a floor (solar
; may raise the bank, the charger never lets it fall), 2 for a ceiling (the
; loads may lower it, nothing raises it), 0 to release. Solar Priority's
; one-way charge/discharge is the owner.
;
; v1.8.0: a hold is anchored to the bank's MEASURED voltage the moment it is
; taken, never to the CVL curve (the curve is calibrated on settled holds
; between 58.6 and 62.3 %; a floor taken at 23 % and clipped to the curve's
; 40 % edge held the bank 10 % away from where it was, 2026-09-07). Under a
; floor the MPPTs get one solar lead of headroom above the hold voltage and
; the Quattro is commanded the hold voltage itself; the hold moves up only,
; on a full SOC step or once the band is absorbed, and a slow servo on the
; coulomb count keeps the SOC exactly where it was between steps.
enabled = true
; hard expiry, like the solar boost. The consumer re-asserts every 30 s. A
; lost consumer lease is NOT a release: REC's policy adapter keeps refreshing
; a hold it retains and returns to shore under it (prepare_intents), so the
; expiry only ends a hold nobody refreshes at all. What a changed target,
; OFF or a recovered consumer mean during that loss is still an open
; decision (master review D13).
hold_s = 120
; the held SOC follows the bank continuously (a floor up on sun only -- PV
; current at least pv_min_a, v1.8.1 -- a ceiling down); the hold VOLTAGE is
; re-anchored to the present pack voltage only once the held SOC has moved
; a full step since the last anchor. The Quattro's re-absorb bursts nudge
; the hi-res SOC by hundredths of a percent, and its trickle at night crept
; the floor up 0.2 % on 2026-09-09; a floor never counts a rise made
; without the sun.
step_pct = 1
; charge current limit while a hold is in force: the published CCL becomes
; "present PV current + this" (0 disables). DVCC gives the MPPTs the whole
; limit and the Quattro only the remainder after PV, so the MPPTs keep a few
; amps of headroom (tracker active, free to ramp) while the Quattro can never
; bulk -- the 0.6-2 kW re-absorb it did on every AC re-accept (13 min, >100
; Wh of shore per reconnect, measured 2026-09-02) was seen with the pack
; above its command. A Quattro command prepared BELOW the pack before the
; relay closes is the staged alternative (repair plan stage A) and has not
; been measured yet; this cap stays until it is. It also limits every PV
; ramp under a hold. Lifted during a solar boost, and not applied when PV
; current cannot be read. Only in LIVE (fallback has CCL 0).
charge_limit_a = 5
; SOC servo (v1.8.0): every servo_period_s the hold voltage moves one
; servo_step_v when the bank is more than servo_deadband_pct away from the
; held SOC in the direction the hold forbids -- under a floor: up while the
; bank sits BELOW the held SOC AND is still draining (once it sits still the
; Quattro is covering the loads and the command is where it needs to be;
; v1.8.1, after a 0.5 V wind-up ahead of the Quattro's slow response
; overshot by 0.25 %), down while the Quattro is charging it ABOVE; under a
; ceiling: down whenever the Quattro is charging. Solar raising the bank is
; never fought. The
; correction starts from zero at every anchor and is bounded: up by
; servo_max_up_v (a load the Quattro's 5 A cap cannot cover would otherwise
; wind it up all night), down by the larger servo_max_down_v (an anchor
; taken mid-bulk can sit a volt or more above the bank's rest, and the
; Quattro feeds the bank at its cap until the command is under it). 0.02 V
; / 30 s is 2.4 V/h: a high anchor is taken out within minutes; a sag is
; answered before the bank has lost a tenth of a percent more.
servo_step_v = 0.02
servo_period_s = 30
servo_deadband_pct = 0.1
servo_max_up_v = 0.5
servo_max_down_v = 2.0
; every anchor is the pack voltage less current x this resistance (the
; drop across the pack): a bank being charged when the hold arrives does
; not anchor high, one under load not low. A rough figure is enough; the
; servo takes out the rest. 0 disables.
anchor_ir_mohm = 3
; solar headroom over the hold voltage under a floor: the standing solar
; lead is widened to this while the floor holds (the Quattro sits on the
; hold voltage either way). At the standing 0.15 V the MPPTs spent most of
; a simulated day throttled at their ceiling with sun to spare; the bank
; takes 0.30 V of headroom at full PV current and the SOC step moves the
; band up before it is filled. Only in force while a lead is (Solar
; Priority on, slider under 100 %).
band_v = 0.30
; "the Quattro is charging": battery current exceeds PV current by more than
; this (with no DC meter, systemcalc's DC-system estimate makes that exactly
; the Quattro's net contribution to the bank)
quattro_idle_a = 1
; band absorbed (floor only): the pack sits within taper_margin_v of the MPPT
; ceiling, the charge current has tapered to taper_a or less, PV current is
; at least pv_min_a and the Quattro is idle -- for taper_s. The bank has then
; taken the whole band and the hold steps up one more band without waiting
; for a full SOC step (a steep part of the curve might never yield one inside
; a 0.15 V band). Never at night: pv_min_a sees to that.
taper_a = 3
taper_s = 60
taper_margin_v = 0.03
pv_min_a = 0.5
; the bank counts as draining (servo up allowed) below minus this current.
; The DC loads alone are ~0.9 A here; 1.8.1 reused quattro_idle_a (1 A) for
; this and a whole night's drain (50 W, 1.5 %) went unseen (2026-09-10).
servo_drain_a = 0.3
; dusk snap (v1.8.4): once PV current has been under pv_min_a for this long
; after a day of sun, the hold re-anchors to the bank's present voltage (a
; floor never down, a ceiling never up). A sunny afternoon raises the held
; SOC without a full-step re-anchor, and the Quattro's command then sat
; 0.13 V under the bank all night (2026-09-10, 1.5 % lost). One snap per
; night; the servo is only the backstop after it.
dusk_s = 300

[publish]
; Telemetry quantisation (v1.6.0). A value only goes on D-Bus when it moves
; to a different step, and each tick's changes go out as ONE ItemsChanged
; instead of a signal per path — the BMS jitter at 0.01 V / 0.1 A was ~4 bus
; signals a second delivered to every listener on the Cerbo (2026-09-05).
; Control paths (CVL/CCL/DCL, targets, solar lead, alarms, sustain, boost)
; are never quantised. Units: V, A, W, °C, %, Ah, s.
voltage_step = 0.05
current_step = 0.5
power_step = 10
temperature_step = 0.5
soc_step = 0.1
ah_step = 1
time_step = 60


[policy]
# Persisted atomically beside this config; deployment never replaces this file.
state_file = solar-control-state.json
capacity_version = rated-1440
# Explicit calendar reporting zone; set the boat zone during commissioning.
calendar_timezone = UTC
shore_ac_input = 1
consumer_service_suffix = solarpriority
consumer_instance = 221
mppt_instances = 278,279

[control]
# Metering diagnostics and physical relay guards; no energy vetoes.
# The three energy figures below are REPORTED (policy snapshot, telemetry),
# never consumed by the active control path: no departure, return or
# regulation decision reads them. Units: the ledger's EFC is
# (charge Ah + discharge Ah) / (2 x capacity), so 0.01 EFC is 28.8 Ah
# combined at the 1440 Ah basis -- 2 % combined movement -- while 1 %
# combined movement is 14.4 Ah (14 Ah at REC's configured 1400 Ah). The
# "about 1 % a day" aim is a paper calculation and a monitoring target
# (reviews/solar-priority-repair-plan-2026-09-14.md, section 4); 0.5-3 %
# days are acceptable and no runtime gate enforces it. The reservation and
# reverse-event lifecycle in energy_accounting.py (reserve, close_reservation,
# end_reverse_event) has no caller in 3.0: its output is not a per-event
# guarantee.
current_settle_s = 30
source_alignment_s = 2
transfer_timeout_s = 30
# How long an ordinary islanded return waits for the exact Quattro/solar pair
# and a current readback inside the envelope before closing the relay anyway
# (repair plan stage A). E03 closed with the pack at 56.41 V against a Quattro
# CVL of 59.34 V and CCL 200 A, the reductions arriving about 3 s and 5 s
# LATER; the point of the wait is that the below-pack command is already in
# force when the AC input is accepted. Expiry is not a fault and takes no
# lockout: the unverified pair is already reported by the regulation fault
# after [cvl] lead_verify_s, and CCL still comes from REC's own guards (0
# outside the envelope, PV + [sustain] charge_limit_a under a hold). A
# protective return -- lost lease, lost sources, withdrawn REC permission --
# never waits at all.
return_prepare_s = 30
ordinary_overhead_efc = 0.01
reverse_event_wh = 20
reverse_day_wh = 100
reverse_response_s = 10
connected_dwell_s = 300
stable_admission_s = 60
hourly_departures = 3
daily_departures = 12
failed_probe_backoff_s = 900
inverter_efficiency = 0.90
inverter_idle_w = 30
demand_uncertainty_w = 30
positive_reserve_w = 20
