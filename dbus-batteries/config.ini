; dbus-batteries configuration — boat-specific values.
;
; IMPORTANT: everything under [sources] is a FIRST-RUN default only. Once a
; setting exists in localsettings (/Settings/N2kBatteries/<key>/...) that value
; wins, so a change made in the GUI / HTML5 app / VRM is never clobbered by a
; redeploy. To force a value back, delete the setting on the Cerbo:
;   dbus -y com.victronenergy.settings /Settings RemoveSettings '%["N2kBatteries/bat2"]'
; and restart the service.

[general]
; DEBUG, INFO, WARNING
log_level = INFO

[can]
interface = can0
reconnect_delay_s = 5

[publish]
; D-Bus update rate. The N2K senders are slower than this (127508 ~1 Hz per
; instance, 127489 ~2 Hz), so this only sets how promptly a new reading lands.
rate_ms = 1000
; No frame for this long -> /Connected = 0 and every measurement blanked.
; A frozen 12.6 V on a start battery is indistinguishable from a healthy one,
; which is why the values are cleared rather than held. Matches the 10 s
; staleness check the Node-RED flow used.
stale_after_s = 10
; ...and after THIS long with no frame the battery is removed from D-Bus
; altogether, instead of sitting in VRM as a permanently disconnected device.
; The engine batteries only exist while the Yanmar ignition is on — the
; gateways are unpowered otherwise — so most of the time they should simply
; not be there. The source keeps its settings, its instance and its catalog
; entry, and comes back on the next frame.
; A source that has NEVER been seen is never published, whatever this is set
; to. Set 0 to publish every enabled source permanently.
unpublish_after_s = 300
product_name = N2K battery

[sources]
; Source keys are derived from the wire, never from a list position:
;   bat<n>  = NMEA 2000 battery/DC instance <n>  (PGN 127508 + 127506)
;   alt<n>  = engine instance <n> alternator     (PGN 127489)
;
; On this vessel: the SIMARINE SN01 SiCOM at N2K address 0x10 reports battery
; instances 1/2/3 (House / Bow / Stern); the two Yanmar gateways at 0x8D/0x8E
; report engine instances 0/1, whose alternator potential IS the engine
; battery voltage (they are not on the SiCOM).
enabled = bat1, bat2, bat3, alt0, alt1

; Device instances, carried over unchanged from InstanceRegistry.json so VRM
; history and Signal K paths survive the migration from the flow.
; Reserved block: 200-209 batteries.
instances = bat1: 201, bat2: 202, bat3: 203, alt0: 204, alt1: 205

names = bat1: House, bat2: Bow, bat3: Stern, alt0: Port Engine, alt1: Starboard Engine

; -> com.victronenergy.battery.<settings_prefix><suffix>
; and /Settings/Devices/<settings_prefix><suffix>/ClassAndVrmInstance
suffixes = bat1: house, bat2: bow, bat3: stern, alt0: porteng, alt1: stbdeng

; Installed capacity in Ah; feeds /InstalledCapacity, and with SOC also
; /Capacity and /ConsumedAmphours. 0 = unknown, those paths stay blank.
; The engine batteries report no SOC at all (127489 is voltage only), so
; giving them a capacity would buy nothing.
capacities = bat1: 130, bat2: 130, bat3: 130

; A battery that turns up on the bus but is not listed above is catalogued and
; left alone. Set true only if you want every new N2K battery to appear in VRM
; by itself.
auto_enable_new = false

; Hard ceiling on how many sources will ever be catalogued. Discovery keys off
; an instance byte from the wire, so a garbled frame that gets past the kernel
; filter could otherwise mint a source (and its settings) on every arrival.
max_sources = 32

; Device instances handed to sources that have none. Monotonic and never
; reused — VRM and Signal K key their history off the instance, so recycling a
; number silently merges two different batteries' histories.
instance_pool = 206-209

; Prefix for the dbus service suffix and the localsettings device id.
; Deliberately NOT `virtual_`: that prefix is the Node-RED palette's, and its
; auto-cleanup deletes entries it does not recognise.
settings_prefix = n2kbat_

[manager]
; The management surface the forked HTML5 app talks to. Both of these persist
; to the same localsettings values, so either can be used:
;   com.victronenergy.n2kbatteries  /Sources/<key>/Enabled  (+ /Catalog)
;   com.victronenergy.settings      /Settings/N2kBatteries/<key>/Enabled
; Writes take effect immediately — the battery service is created or torn down
; in place, no restart.
enabled = true
service = com.victronenergy.n2kbatteries
settings_group = N2kBatteries
; Backstop poll for settings written by something that does not emit
; PropertiesChanged the way we expect. Direct writes are normally picked up at
; once via the signal.
reconcile_s = 30
