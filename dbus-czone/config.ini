; dbus-czone configuration — boat-specific values.
; All values shown are also the built-in defaults unless noted.

[general]
; DEBUG, INFO, WARNING
log_level = INFO

[can]
interface = can0
; Source address for the frames we transmit. 0xFE is the NMEA 2000 "null"
; address; the CZone UC1 accepts both control and query frames from it —
; no address claim or handshake is needed.
source_address = 0xFE
reconnect_delay_s = 5

[discovery]
; Phase 1 is passive: the bank instances the UC1 broadcasts in PGN 127501 are
; the bank list, and the count of 2-bit fields that are not "unavailable" is
; the circuit count. Nothing about the bank is hardcoded.
status_listen_s = 8
; Phase 2 asks the UC1 to describe each circuit (PGN 65299 -> 130820).
; Replies arrive in 2-13 ms; the timeout only matters if CZone is busy.
query_timeout_s = 1.0
query_retries = 3
; Bank 1 is the user latch that the MFD and the keypads share — always
; control this one. A configuration may define further banks over the same
; outputs, but they OR together, so a secondary bank cannot clear a latch
; set on bank 1.
prefer_bank = 1

[switch]
; -> com.victronenergy.switch.czone
service_suffix = czone
; -> /Settings/Devices/czone/ClassAndVrmInstance (instance pinning)
settings_id = czone
; registry convention: 220-239 switches. 224 was free. The Node-RED flow's
; 225-235 are RETIRED, not reused: its rows were removed from
; InstanceRegistry.json so the enforcement pass stops re-creating their
; settings entries and the orphan audit can finally delete them.
instance = 224
product_name = CZone switch bank
custom_name = CZone
; each output's Group becomes "<prefix> <category>", category discovered
; from CZone (Navigation / Lighting / Pump)
group_prefix = CZone

; Which outputs are MOMENTARY (output_N, 1-based — output_1 is bank index 0).
; The latching/momentary split is absent from every message the UC1 sends, so
; it is seeded here and then persisted per output. Change it later in the
; Venus GUI (each output has a Type control) — the driver stores your choice
; and this line is only the first-run default.
;
; NOT a guess: derived from the boat's own CZone configuration. The split is
; recorded in the .zcf (commander byte 3: 0x09 momentary, 0x01/0x03/0x04
; latching), just never broadcast. Regenerate this line after any change in
; the CZone Configuration Tool with:
;     python zcf_parse.py 48-56.zcf
; On this vessel the bilge pumps and the horn follow the button.
momentary_outputs = 1, 2, 3

[control]
; A latching press is followed by a release that re-arms the press detector.
; The MFD sends one; latching circuits ignore it.
release_delay_ms = 120
; Re-sending a latching press TOGGLES, so a retry is only issued on positive
; evidence the last one was lost (a status frame newer than it that still
; disagrees) AND after this long — which must stay well above CAN send
; latency. Only one retry: a wrong toggle is worse than a missed click.
retry_after_s = 2.5
max_sends = 2
; Give up and revert the switch to the real CZone state after this long.
give_up_s = 9
; A latching press is a toggle, so it needs trustworthy state. The UC1
; broadcasts status every 2 s; older than this means the CAN feed has died,
; and the command is refused rather than guessed.
stale_state_s = 6
