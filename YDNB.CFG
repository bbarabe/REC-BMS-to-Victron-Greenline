# Current configuration of Yacht Devices NMEA 2000 Bridge
# Firmware: 1.42 25/05/2022
# Password level: 0

FW_CAN1_TO_CAN2=ON
FW_CAN2_TO_CAN1=OFF
STRICT_QUEUE=OFF
CAN2_SPEED=250
# Repackage specific REC-BMS 11-bit CAN frames as 29-bit
# so they pass through VE.Can filters on the Cerbo.
# Original CAN ID 0xNNN becomes 0x18FF0NNN on CAN2.
# 16 filters for the exact BMS CAN IDs we need.

match(CAN1, 0x00000351, 0x01FFFFFF)
{
set(0, UINT32, 0x18FF0351)
set(4, UINT8, 0xFF)
send(CAN2)
}
